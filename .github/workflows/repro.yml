# Temporary: runs released builds on test desktops to find out why the docked weather strip
# comes and goes after the update to 1.1.16. To be removed with .github/repro when that is known.
name: Desktop lab
# Only a push that changes the lab itself starts it, so that work on the app does not.
on:
  push:
    branches: ['claude/**']
    paths:
      - .github/repro/**
      - .github/workflows/repro.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: strip ${{ matrix.version }} on Windows Server 2025
    strategy:
      fail-fast: false
      matrix:
        version: ['1.1.16', '1.1.15']
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the docked strip on a test desktop
        shell: pwsh
        run: ./.github/repro/dock.ps1 -Version '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-server-${{ matrix.version }}
          path: ${{ runner.temp }}/lab-summary.txt
          if-no-files-found: ignore
          retention-days: 1
  eleven:
    name: strip ${{ matrix.version }} on Windows 11
    strategy:
      fail-fast: false
      matrix:
        version: ['1.1.16', '1.1.15']
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the docked strip on a test desktop
        shell: pwsh
        run: ./.github/repro/dock.ps1 -Version '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-eleven-${{ matrix.version }}
          path: ${{ runner.temp }}/lab-summary.txt
          if-no-files-found: ignore
          retention-days: 1
  server-summary:
    name: Summary, Windows Server 2025
    needs: server
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab-server-*
          path: lab
      - name: Print every summary
        run: |
          for f in lab/*/lab-summary.txt; do echo "===== $f"; cat "$f"; echo; done
  eleven-summary:
    name: Summary, Windows 11
    needs: eleven
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab-eleven-*
          path: lab
      - name: Print every summary
        run: |
          for f in lab/*/lab-summary.txt; do echo "===== $f"; cat "$f"; echo; done
