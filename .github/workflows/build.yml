name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A version tag (v1.2.3) publishes the installer to a GitHub Release, which is where
      # installed copies of the app look for updates.
      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist -- --publish never
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skylight-windows
          path: |
            dist/*.exe
          if-no-files-found: error
