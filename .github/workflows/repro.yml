# Temporary: finds out why the widget of a released build disappears on some desktops.
name: Desktop lab
on:
  pull_request:
    paths:
      - .github/repro/**
      - .github/workflows/repro.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    name: ${{ matrix.version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        version: ['1.1.16', '1.1.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the app on differently set up desktops
        shell: pwsh
        run: ./.github/repro/desktop.ps1 -Version '${{ matrix.version }}'
