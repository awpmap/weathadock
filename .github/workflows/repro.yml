# Temporary: runs the app on test desktops to find out why the docked weather strip comes and
# goes after the update to 1.1.16, and to try the fix. To be removed with .github/repro.
name: Desktop lab
# Only a push that changes the lab itself starts it, so that work on the app does not.
on:
  push:
    branches: ['claude/**']
    paths:
      - .github/repro/**
      - .github/workflows/repro.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixed:
    name: fixed strip on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The installer the build of this same commit made, as soon as it is there.
      - name: Take the app built from this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $auth = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $art = $null
          foreach ($try in 1..90) {
            $runs = (Invoke-RestMethod "$api/actions/workflows/build.yml/runs?head_sha=$env:GITHUB_SHA" -Headers $auth).workflow_runs
            foreach ($r in $runs) {
              $art = (Invoke-RestMethod "$api/actions/runs/$($r.id)/artifacts" -Headers $auth).artifacts | Where-Object { $_.name -eq 'WeathaDock-windows' } | Select-Object -First 1
              if ($art) { break }
            }
            if ($art) { break }
            Start-Sleep -Seconds 20
          }
          if (-not $art) { throw 'No installer was built from this commit within half an hour.' }
          Invoke-WebRequest "$api/actions/artifacts/$($art.id)/zip" -Headers $auth -OutFile built.zip
          Expand-Archive built.zip -DestinationPath built
          $setup = Get-ChildItem built -Filter *-setup.exe | Select-Object -First 1
          "installer: $($setup.Name)"
          "SETUP=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Run the docked strip on a test desktop
        shell: pwsh
        run: ./.github/repro/dock.ps1 -Version 'fixed' -Installer $env:SETUP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.os }}
          path: ${{ runner.temp }}/lab-summary.txt
          if-no-files-found: ignore
          retention-days: 1
  summary:
    name: Summary
    needs: fixed
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab-*
          path: lab
      - name: Print every summary
        run: |
          for f in lab/*/lab-summary.txt; do echo "===== $f"; cat "$f"; echo; done
