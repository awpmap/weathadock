name: Build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Releases follow the version in package.json: the first build on main with a version
      # that has no GitHub Release yet publishes the installer there. Installed copies of the
      # app look at the latest release for updates.
      - name: Decide whether to publish
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          publish=never
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if ! gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then publish=always; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish: $publish"
      - name: Build
        run: npm run dist -- --publish ${{ steps.plan.outputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: WeathaDock-windows
          path: |
            dist/*.exe
          if-no-files-found: error
